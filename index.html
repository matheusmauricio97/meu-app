<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Finanças</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231A7A4A'/><path d='M20 44V20h14c4.4 0 7 2.2 7 5.5 0 2.2-1.2 3.8-3 4.6 2.4.8 4 2.7 4 5.2C42 39.2 39 44 33 44H20zm6-14h7c2 0 3-1 3-2.8S35 24 33 24h-7v6zm0 8h8c2.2 0 3.5-1.2 3.5-3.2S36 31 34 31h-8v7z' fill='white'/></svg>">
<style>
:root{
  --G:#1A7A4A;--GM:#2ECC71;--GG:rgba(46,204,113,0.2);
  --R:#C0021A;--RM:#FF3B30;
  --B:#0057C8;--BM:#007AFF;
  --P:#5856D6;
  --TX:#1C1C1E;--T2:#48484A;--T3:#8E8E93;
  --bg1:rgba(255,255,255,0.88);--bg2:rgba(255,255,255,0.72);
  --bd:rgba(255,255,255,0.55);--bd2:rgba(255,255,255,0.3);
  --sh:0 8px 32px rgba(0,0,0,0.12),0 1.5px 4px rgba(0,0,0,0.08);
  --in:inset 0 1px 0 rgba(255,255,255,0.6);
  --bl:blur(24px) saturate(1.8);--bl2:blur(12px) saturate(1.6);
  --r:12px;--rl:16px;--rx:20px;
  --f:-apple-system,'Helvetica Neue',sans-serif;
  --m:'SF Mono',ui-monospace,'Courier New',monospace;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,20px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --bbg1:#e2f2ea;--bbg2:#d8ecf8;--bbg3:#e8e2f5;
  --hdr-bg1:#1A6B40;--hdr-bg2:#0F4A2A;
  --mi-bg:rgba(255,255,255,0.8);--mi-bd:rgba(0,0,0,0.15);
  --mo-bg:rgba(242,242,247,0.97);--mo-e-bg:rgba(235,240,255,0.97);
  --sec-bg:rgba(255,255,255,0.5);
  --foc-bg:rgba(0,0,0,0.05);
  --row-bd:rgba(0,0,0,0.06);
  --th-bg:rgba(26,122,74,0.85);
  --srec:rgba(46,204,113,0.1);--sdep:rgba(255,59,48,0.09);--sinv:rgba(0,122,255,0.09);
  --tot-bg:rgba(0,0,0,0.035);
  --bar-bg:rgba(0,0,0,0.07);
  --gh-bg:rgba(26,122,74,0.82);
  --dw-bg:rgba(255,255,255,0.6);--dw-bd:rgba(0,0,0,0.1);
  --sab-bg:rgba(255,255,255,0.5);--sab-bd:rgba(0,0,0,0.07);
  --ci-bd:rgba(0,0,0,0.08);
  --opt-bg:rgba(0,0,0,0.04);--opt-bd:rgba(0,0,0,0.12);
}
[data-theme="dark"]{
  --TX:#F2F2F7;--T2:#EBEBF5;--T3:#636366;
  --bg1:rgba(28,28,34,0.92);--bg2:rgba(20,20,26,0.88);
  --bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.07);
  --sh:0 8px 32px rgba(0,0,0,0.5),0 1.5px 4px rgba(0,0,0,0.4);
  --in:inset 0 1px 0 rgba(255,255,255,0.06);
  --bbg1:#0c1610;--bbg2:#0c131b;--bbg3:#111020;
  --hdr-bg1:#14502E;--hdr-bg2:#0A3520;
  --mi-bg:rgba(48,48,56,0.95);--mi-bd:rgba(255,255,255,0.12);
  --mo-bg:rgba(26,26,32,0.99);--mo-e-bg:rgba(20,20,36,0.99);
  --sec-bg:rgba(255,255,255,0.04);
  --foc-bg:rgba(255,255,255,0.08);
  --row-bd:rgba(255,255,255,0.06);
  --th-bg:rgba(18,80,48,0.98);
  --srec:rgba(46,204,113,0.08);--sdep:rgba(255,59,48,0.08);--sinv:rgba(0,122,255,0.08);
  --tot-bg:rgba(255,255,255,0.05);
  --bar-bg:rgba(255,255,255,0.1);
  --gh-bg:rgba(12,52,30,0.98);
  --dw-bg:rgba(255,255,255,0.05);--dw-bd:rgba(255,255,255,0.1);
  --sab-bg:rgba(255,255,255,0.04);--sab-bd:rgba(255,255,255,0.08);
  --ci-bd:rgba(255,255,255,0.08);
  --opt-bg:rgba(255,255,255,0.07);--opt-bd:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background-color:var(--hdr-bg2);height:100%;overflow:hidden;position:fixed;width:100%;}
body{font-family:var(--f);background:linear-gradient(145deg,var(--bbg1) 0%,var(--bbg2) 55%,var(--bbg3) 100%);color:var(--TX);font-size:14px;height:100dvh;width:100%;overflow:hidden;position:fixed;top:0;left:0;transition:background 0.5s;}
.app{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:480px;margin:0 auto;position:relative;z-index:1;overflow:hidden;}
@media(min-width:768px){
  html,body{position:static;overflow:auto;height:auto;background-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .app{height:92vh;border-radius:var(--rx);overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.3),0 0 0 0.5px rgba(255,255,255,0.1);}
}
.hdr{background:linear-gradient(160deg,var(--hdr-bg1) 0%,var(--hdr-bg2) 100%);padding-top:calc(var(--safe-top) + 10px);padding-left:max(18px,var(--safe-left));padding-right:max(18px,var(--safe-right));padding-bottom:16px;flex-shrink:0;box-shadow:0 1px 0 rgba(255,255,255,0.08),0 4px 20px rgba(0,0,0,0.25);}
@media(min-width:768px){.hdr{padding-top:22px;}}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hdr-title{font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.4px;}
.mnav{display:flex;align-items:center;gap:6px;}
.mnav button{width:30px;height:30px;border:0.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:8px;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mnav button:active{background:rgba(255,255,255,0.32);}
.mnav-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.9);min-width:82px;text-align:center;}
.cat-btn{background:rgba(255,255,255,0.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:0.5px dashed rgba(255,255,255,0.45);border-radius:8px;color:rgba(255,255,255,0.92);font-size:12px;font-family:var(--f);padding:6px 11px;cursor:pointer;}
.cat-btn:active{background:rgba(255,255,255,0.28);}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rc{background:rgba(255,255,255,0.13);border:0.5px solid rgba(255,255,255,0.22);border-radius:var(--r);padding:9px 10px;}
.rc-lbl{font-size:10px;color:rgba(255,255,255,0.6);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.6px;}
.rc-val{font-size:14px;font-weight:600;color:#fff;font-family:var(--m);letter-spacing:-0.3px;}
.rc-hint{font-size:9px;color:rgba(255,255,255,0.5);margin-top:2px;line-height:1.3;}
.abas-wrap{flex-shrink:0;background:var(--bg2);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2);border-bottom:0.5px solid var(--bd2);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.abas-wrap::-webkit-scrollbar{display:none;}
.abas-inner{display:flex;padding:0 10px;min-width:max-content;}
.ab{padding:10px 14px;font-size:13px;font-family:var(--f);font-weight:400;color:var(--T3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color 0.15s;}
.ab.on{color:var(--G);font-weight:600;border-bottom-color:var(--G);}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bot)+16px);}
.tc{padding:14px;}
.tw{background:var(--bg1);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:0.5px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh),var(--in);}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
thead th{background:var(--th-bg);color:rgba(255,255,255,0.95);font-weight:600;font-size:12px;padding:10px 14px;text-align:left;}
thead th:last-child{text-align:right;width:120px;}
tr.s-rec td{background:var(--srec);color:var(--G);font-size:11px;font-weight:600;padding:5px 14px;text-transform:uppercase;letter-spacing:0.5px;}
tr.s-dep td{background:var(--sdep);color:var(--R);font-size:11px;font-weight:600;padding:5px 14px;text-transform:uppercase;letter-spacing:0.5px;}
tr.s-inv td{background:var(--sinv);color:var(--B);font-size:11px;font-weight:600;padding:5px 14px;text-transform:uppercase;letter-spacing:0.5px;}
tbody td{padding:10px 14px;border-bottom:0.5px solid var(--row-bd);font-size:13px;color:var(--TX);vertical-align:middle;}
tbody td:last-child{text-align:right;}
tbody tr:last-child td{border-bottom:none;}
tr.tot td{background:var(--tot-bg);font-weight:600;font-size:13px;}
.cd{display:flex;align-items:center;gap:6px;}
.cd input{border:none;background:none;font-size:13px;font-family:var(--f);color:var(--TX);width:100%;outline:none;padding:2px 0;}
.cd input:focus{background:var(--foc-bg);border-radius:4px;padding:2px 6px;}
.cv-cell{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:nowrap;}
.cv-cell input{border:none;background:none;font-size:13px;font-family:var(--m);color:var(--TX);width:76px;text-align:right;outline:none;padding:2px 0;}
.cv-cell input:focus{background:var(--foc-bg);border-radius:4px;padding:2px 6px;}
.ptag{font-size:9px;padding:2px 5px;border-radius:99px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.ptag-p{background:rgba(88,86,214,0.14);color:var(--P);}
.ptag-r{background:rgba(46,204,113,0.14);color:var(--G);}
.ptag-x{background:rgba(255,59,48,0.12);color:var(--RM);}
.dbtn{background:none;border:none;color:var(--T3);cursor:pointer;font-size:16px;line-height:1;padding:2px;flex-shrink:0;}
.dbtn:active{color:var(--RM);}
.cat-charts{padding:12px 14px;border-bottom:0.5px solid var(--row-bd);background:var(--sec-bg);display:flex;flex-direction:column;gap:10px;}
.cat-chart-block{display:flex;flex-direction:column;gap:5px;}
.cat-chart-title{font-size:10px;font-weight:600;color:var(--T3);text-transform:uppercase;letter-spacing:0.5px;}
.cat-bar-row{display:flex;align-items:center;gap:7px;}
.cat-bar-lbl{font-size:11px;color:var(--T2);width:90px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-bar-track{flex:1;background:var(--bar-bg);border-radius:99px;height:6px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.cat-bar-val{font-size:10px;font-family:var(--m);color:var(--TX);width:70px;text-align:right;flex-shrink:0;}
.al{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:0.5px solid var(--row-bd);background:var(--sec-bg);}
.al-tipo{display:flex;gap:6px;}
.at{flex:1;padding:6px 4px;font-size:11px;font-family:var(--f);font-weight:500;border-radius:6px;cursor:pointer;border:0.5px solid var(--opt-bd);background:var(--opt-bg);color:var(--T3);transition:all 0.15s;}
.at.ar{background:rgba(46,204,113,0.15);color:var(--G);border-color:rgba(46,204,113,0.4);}
.at.ad{background:rgba(255,59,48,0.12);color:var(--R);border-color:rgba(255,59,48,0.3);}
.at.ai{background:rgba(0,122,255,0.12);color:var(--B);border-color:rgba(0,122,255,0.3);}
.lnc-modos{display:flex;gap:5px;flex-wrap:wrap;}
.lm{flex:1;min-width:60px;padding:6px 4px;font-size:10px;font-family:var(--f);font-weight:500;border-radius:6px;cursor:pointer;border:0.5px solid var(--opt-bd);background:var(--opt-bg);color:var(--T3);text-align:center;transition:all 0.15s;line-height:1.3;}
.lm.on-p{background:rgba(88,86,214,0.14);color:var(--P);border-color:rgba(88,86,214,0.35);font-weight:600;}
.lm.on-g{background:rgba(46,204,113,0.15);color:var(--G);border-color:rgba(46,204,113,0.4);font-weight:600;}
.lm.on-x{background:rgba(255,59,48,0.1);color:var(--RM);border-color:rgba(255,59,48,0.3);font-weight:600;}
.parc-wrap{display:none;align-items:center;gap:5px;background:var(--mi-bg);border:0.5px solid var(--opt-bd);border-radius:6px;padding:5px 9px;}
.parc-wrap.show{display:flex;}
.parc-wrap input{width:36px;border:none;background:none;font-size:13px;font-family:var(--m);color:var(--TX);text-align:center;outline:none;}
.parc-wrap span{font-size:11px;color:var(--T3);}
.al-row{display:flex;align-items:center;gap:8px;}
.al-row input{flex:1;border:none;background:none;font-size:13px;font-family:var(--f);color:var(--TX);outline:none;}
.al-row input[type=number]{width:74px;flex:none;text-align:right;font-family:var(--m);}
.abtn{background:linear-gradient(135deg,var(--GM),var(--G));color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-family:var(--f);font-weight:600;cursor:pointer;box-shadow:0 2px 8px var(--GG);flex-shrink:0;}
.abtn:active{opacity:0.85;}
.sf{font-size:11px;color:var(--T3);padding:9px 14px;border-top:0.5px solid var(--row-bd);background:var(--sec-bg);line-height:1.4;}
.gc{padding:14px;display:flex;flex-direction:column;gap:12px;}
.gcard{background:var(--bg1);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:0.5px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh),var(--in);}
.gh{background:var(--gh-bg);color:rgba(255,255,255,0.95);font-size:11px;font-weight:600;padding:9px 14px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:space-between;}
.gb{padding:14px;}
.br{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.br:last-child{margin-bottom:0;}
.bl{font-size:12px;color:var(--T2);width:90px;flex-shrink:0;text-align:right;}
.bb{flex:1;background:var(--bar-bg);border-radius:99px;height:7px;overflow:hidden;}
.bf{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}
.bv{font-size:11px;font-family:var(--m);color:var(--TX);width:78px;text-align:right;flex-shrink:0;}
.g-ano-nav{display:flex;align-items:center;gap:6px;}
.g-ano-nav button{width:20px;height:20px;background:rgba(255,255,255,0.2);border:0.5px solid rgba(255,255,255,0.3);border-radius:5px;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.g-ano-nav span{font-size:11px;color:rgba(255,255,255,0.9);font-weight:600;min-width:32px;text-align:center;}
.anc{padding:14px;}
.anav{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0 14px;}
.anav button{width:34px;height:34px;background:var(--bg1);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2);border:0.5px solid var(--bd);border-radius:10px;color:var(--TX);font-size:17px;cursor:pointer;box-shadow:var(--sh);}
.anav button:active{background:var(--foc-bg);}
.anav span{font-size:18px;font-weight:600;color:var(--TX);min-width:60px;text-align:center;letter-spacing:-0.4px;}
.ares{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.acard{background:var(--bg1);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2);border:0.5px solid var(--bd);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh),var(--in);}
.acard .lbl{font-size:10px;color:var(--T3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px;}
.acard .val{font-size:16px;font-weight:600;font-family:var(--m);letter-spacing:-0.3px;}
.aw{background:var(--bg1);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:0.5px solid var(--bd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh),var(--in);}
.asc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.aw table{width:100%;border-collapse:collapse;min-width:320px;table-layout:auto;}
.aw thead th{background:var(--gh-bg);color:rgba(255,255,255,0.95);font-size:11px;font-weight:600;padding:9px 8px;text-align:right;white-space:nowrap;}
.aw thead th:first-child{text-align:left;min-width:32px;}
.aw tbody td{padding:8px 8px;border-bottom:0.5px solid var(--row-bd);font-size:11px;font-family:var(--m);text-align:right;white-space:nowrap;}
.aw tbody td:first-child{font-family:var(--f);text-align:left;color:var(--T2);font-size:12px;font-weight:500;}
.aw tbody tr:last-child td{border-bottom:none;}
.aw tbody tr.tot td{background:var(--tot-bg);font-weight:700;}
.cv{color:var(--G)!important;}.cr{color:var(--RM)!important;}.cb{color:var(--BM)!important;}.cp{color:var(--P)!important;}
.mo{font-family:var(--m);}
.cat-tipo-badge{display:inline-block;font-size:9px;font-weight:600;padding:2px 6px;border-radius:99px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:0.4px;}
.badge-rec{background:rgba(46,204,113,0.15);color:var(--G);}
.badge-dep{background:rgba(255,59,48,0.12);color:var(--RM);}
.badge-inv{background:rgba(0,122,255,0.12);color:var(--BM);}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
@media(min-width:768px){.ov{align-items:center;}}
.mo-box{background:var(--mo-bg);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border-radius:22px 22px 0 0;border:0.5px solid var(--bd);box-shadow:0 -4px 40px rgba(0,0,0,0.3);padding:20px;padding-bottom:calc(var(--safe-bot)+20px);width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;}
@media(min-width:768px){.mo-box{border-radius:var(--rx);max-height:85vh;padding-bottom:20px;}}
.mo-handle{width:38px;height:4px;background:rgba(128,128,128,0.3);border-radius:99px;margin:0 auto 18px;}
@media(min-width:768px){.mo-handle{display:none;}}
.mo-box h3{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:-0.3px;color:var(--TX);}
.mi{width:100%;background:var(--mi-bg);border:0.5px solid var(--mi-bd);border-radius:var(--r);padding:11px 13px;font-size:14px;font-family:var(--f);color:var(--TX);outline:none;margin-bottom:10px;}
.mi:focus{border-color:var(--G);}
.mo-foot{display:flex;gap:8px;margin-top:8px;}
.mo-foot button{flex:1;padding:13px;font-size:15px;font-family:var(--f);font-weight:600;border-radius:var(--r);cursor:pointer;border:none;}
.bcl{background:rgba(128,128,128,0.15);color:var(--T2);}
.bcl:active{background:rgba(128,128,128,0.25);}
.bok{background:linear-gradient(135deg,var(--GM),var(--G));color:#fff;box-shadow:0 3px 12px var(--GG);}
.bok:active{opacity:0.85;}
.clist{margin-bottom:16px;}
.ci{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:0.5px solid var(--ci-bd);background:transparent;transition:background 0.15s;position:relative;}
.ci:last-child{border-bottom:none;}
.ci.drag-target-above::before{content:'';position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--GM);border-radius:99px;}
.ci.drag-target-below::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--GM);border-radius:99px;}
.ci.dragging-source{opacity:0.3;}

.drag-ghost{position:fixed;pointer-events:none;z-index:9999;left:0;top:0;background:rgba(255,255,255,0.97);border:1.5px solid var(--GM);border-radius:12px;padding:10px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.22),0 2px 8px rgba(46,204,113,0.3);font-size:14px;font-family:var(--f);color:#1C1C1E;font-weight:500;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:160px;transform:rotate(1.5deg) scale(1.04);display:flex;align-items:center;gap:8px;opacity:0.97;}

.rec-opt.on{background:rgba(88,86,214,0.14);color:var(--P);border-color:rgba(88,86,214,0.35);font-weight:600;}

.date-row .mi{margin-bottom:0;flex:1;}
.val-rec{color:var(--G);font-family:var(--m);}
.val-dep{color:var(--RM);font-family:var(--m);}

#ov-edit .mo-box{background:var(--mo-e-bg);}
.edit-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.edit-header h3{margin-bottom:0;flex:1;}

.sub-abas{display:flex;padding:0 14px;border-bottom:0.5px solid var(--sab-bd);background:var(--sab-bg);}
.sub-ab{padding:8px 14px;font-size:12px;font-family:var(--f);font-weight:500;color:var(--T3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color 0.15s;}
.sub-ab.on{color:var(--G);font-weight:600;border-bottom-color:var(--G);}
.g-mini-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.g-mini{border-radius:8px;padding:7px 8px;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-top">
      <div class="mnav">
        <button onclick="mudaMes(-1)">&#8249;</button>
        <span class="mnav-label" id="mesTit"></span>
        <button onclick="mudaMes(1)">&#8250;</button>
      </div>
      <div class="hdr-title">Finanças</div>
      <button class="cat-btn" onclick="abrirModal()">+ Categorias</button>
    </div>
    <div class="resumo">
      <div class="rc"><div class="rc-lbl">Receitas</div><div class="rc-val" id="sRec">R$0</div></div>
      <div class="rc"><div class="rc-lbl">Despesas</div><div class="rc-val" id="sDep">R$0</div></div>
      <div class="rc"><div class="rc-lbl">Saldo</div><div class="rc-val" id="sSaldo">R$0</div><div class="rc-hint" id="sHint"></div></div>
    </div>
  </div>
  <div class="abas-wrap"><div class="abas-inner" id="abas"></div></div>
  <div class="main" id="main"></div>
</div>
 
<!-- Modal: criar categoria -->
<div class="ov" id="ov">
  <div class="mo-box">
    <div class="mo-handle"></div>
    <h3>Categorias</h3>
    <div class="clist" id="clist"></div>
    <div class="slbl">Nova categoria</div>
    <input class="mi" id="nNome" placeholder="Nome da categoria..."/>
    <div class="slbl" style="margin-top:4px;">Recorrência</div>
    <div class="rec-opts" id="rec-opts-new">
      <div class="rec-opt on" data-rec="perpetua" onclick="setRec('perpetua','new')">Perpétua</div>
      <div class="rec-opt" data-rec="mensal" onclick="setRec('mensal','new')">Mensal</div>
      <div class="rec-opt" data-rec="bimestral" onclick="setRec('bimestral','new')">Bimestral</div>
      <div class="rec-opt" data-rec="custom" onclick="setRec('custom','new')">Personaliz.</div>
    </div>
    <div class="date-wrap" id="dateWrap">
      <div class="date-row"><label>Início</label><input class="mi" type="month" id="nInicio"/></div>
      <div class="date-row" id="fimRow"><label>Fim</label><input class="mi" type="month" id="nFim"/></div>
      <div class="date-row" id="customRow" style="display:none;">
        <label>A cada</label>
        <input class="mi" type="number" id="nCustomMeses" min="1" max="24" placeholder="meses" style="max-width:90px;"/>
        <span style="font-size:12px;color:var(--T3);">meses</span>
      </div>
    </div>
    <div class="mo-foot">
      <button class="bcl" onclick="fecharModal()">Fechar</button>
      <button class="bok" onclick="adicionarCat()">Adicionar</button>
    </div>
  </div>
</div>
 
<!-- Modal: editar categoria -->
<div class="ov" id="ov-edit">
  <div class="mo-box">
    <div class="mo-handle"></div>
    <div class="edit-header">
      <h3>Editar categoria</h3>
      <span class="edit-badge">Editando</span>
    </div>
    <input class="mi" id="eNome" placeholder="Nome da categoria..."/>
    <div class="slbl">Recorrência</div>
    <div class="rec-opts" id="rec-opts-edit">
      <div class="rec-opt on" data-rec="perpetua" onclick="setRec('perpetua','edit')">Perpétua</div>
      <div class="rec-opt" data-rec="mensal" onclick="setRec('mensal','edit')">Mensal</div>
      <div class="rec-opt" data-rec="bimestral" onclick="setRec('bimestral','edit')">Bimestral</div>
      <div class="rec-opt" data-rec="custom" onclick="setRec('custom','edit')">Personaliz.</div>
    </div>
    <div class="date-wrap" id="dateWrap-edit">
      <div class="date-row"><label>Início</label><input class="mi" type="month" id="eInicio"/></div>
      <div class="date-row" id="fimRow-edit"><label>Fim</label><input class="mi" type="month" id="eFim"/></div>
      <div class="date-row" id="customRow-edit" style="display:none;">
        <label>A cada</label>
        <input class="mi" type="number" id="eCustomMeses" min="1" max="24" placeholder="meses" style="max-width:90px;"/>
        <span style="font-size:12px;color:var(--T3);">meses</span>
      </div>
    </div>
    <div class="mo-foot">
      <button class="bcl" onclick="fecharModalEdit()">Cancelar</button>
      <button class="bok" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MC=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
 
function fmt(v){return'R$\u00A0'+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtA(v){let a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+'R$'+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M';if(a>=1000)return s+'R$'+(a/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k';return s+'R$'+a.toLocaleString('pt-BR',{minimumFractionDigits:0});}
function fmtS(v){let a=Math.abs(v),s=v<0?'-':'';return a>=1000?s+'R$'+(a/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k':s+'R$'+a.toLocaleString('pt-BR',{minimumFractionDigits:0});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
 
function aplicarTema(){
  const h=new Date().getHours();
  const escuro=(h>=19||h<7);
  document.documentElement.setAttribute('data-theme',escuro?'dark':'light');
  document.getElementById('themeColor').content=escuro?'#0A3520':'#1A6B40';
  document.documentElement.style.backgroundColor=escuro?'#0A3520':'#1A6B40';
}
aplicarTema();
setInterval(aplicarTema,5*60*1000);
 
function editIconSVG(){
  return`<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10.5 1.5L13.5 4.5L5 13H2V10L10.5 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 3.5L11.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2 13H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/></svg>`;
}
 
let hoje=new Date(),_m=hoje.getMonth()+1,_y=hoje.getFullYear(),M=_m>11?0:_m,Y=_m>11?_y+1:_y,AY=hoje.getFullYear(),GY=hoje.getFullYear();
let aba='balanco',subAba='balanco',chartRef=null;
let novaRec='perpetua',editRec='perpetua';
let editCatId=null;
let lncModo='unico',lncParcelas=2;
 
const FIXAS=['balanco','graficos','anual'];
 
let cats=[
  {id:'balanco',nome:'Balanço geral',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'salario',nome:'Salário',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'cartao_itau',nome:'Cartão Itaú',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'cartao_nubank',nome:'Cartão Nubank',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'aluguel',nome:'Aluguel',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'mercado',nome:'Mercado',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'transporte',nome:'Transporte',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'investimentos',nome:'Investimentos',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'graficos',nome:'Gráficos',rec:'perpetua',customMeses:null,inicio:null,fim:null},
  {id:'anual',nome:'Ano',rec:'perpetua',customMeses:null,inicio:null,fim:null},
];
let dados={};
 
function salvar(){
  try{localStorage.setItem('fin7_d',JSON.stringify(dados));localStorage.setItem('fin7_c',JSON.stringify(cats.filter(c=>!FIXAS.includes(c.id))));}catch(e){}
}
function carregar(){
  try{
    let d=localStorage.getItem('fin7_d')||localStorage.getItem('fin6_d')||localStorage.getItem('fin5_d')||localStorage.getItem('fin4_d');
    if(d)dados=JSON.parse(d);
    let c=localStorage.getItem('fin7_c')||localStorage.getItem('fin6_c')||localStorage.getItem('fin5_c')||localStorage.getItem('fin4_c');
    if(c){
      let sv=JSON.parse(c);
      cats=[
        {id:'balanco',nome:'Balanço geral',rec:'perpetua',customMeses:null,inicio:null,fim:null},
        ...sv.map(x=>migrarCat(x)),
        {id:'graficos',nome:'Gráficos',rec:'perpetua',customMeses:null,inicio:null,fim:null},
        {id:'anual',nome:'Ano',rec:'perpetua',customMeses:null,inicio:null,fim:null},
      ];
    }
  }catch(e){}
}
function migrarCat(x){
  return{id:x.id,nome:x.nome,rec:x.rec||(x.temp?'mensal':'perpetua'),customMeses:x.customMeses||null,inicio:x.inicio||null,fim:x.fim||x.ate||null};
}
carregar();
 
function catAtiva(c,m,y){
  let key=toKey(m,y);
  if(c.inicio&&key<c.inicio)return false;
  if(c.fim&&key>c.fim)return false;
  if(c.rec==='perpetua'||c.rec==='mensal')return true;
  let base=c.inicio||'2020-01';
  let[by,bm]=base.split('-').map(Number);
  let diff=(y-by)*12+(m-(bm-1));
  if(c.rec==='bimestral')return diff%2===0;
  if(c.rec==='custom'){let n=parseInt(c.customMeses)||1;return diff%n===0;}
  return true;
}
function toKey(m,y){return`${y}-${String(m+1).padStart(2,'0')}`;}
function recLabel(c){
  if(c.rec==='perpetua')return'perpétua';
  if(c.rec==='mensal')return'mensal';
  if(c.rec==='bimestral')return'bimestral';
  if(c.rec==='custom')return`a cada ${c.customMeses}m`;
  return'';
}
 
function setRec(r,ctx){
  if(ctx==='edit'){
    editRec=r;
    document.querySelectorAll('#rec-opts-edit .rec-opt').forEach(el=>el.classList.toggle('on',el.dataset.rec===r));
    document.getElementById('fimRow-edit').style.display=r==='perpetua'?'none':'';
    document.getElementById('customRow-edit').style.display=r==='custom'?'':'none';
  } else {
    novaRec=r;
    document.querySelectorAll('#rec-opts-new .rec-opt').forEach(el=>el.classList.toggle('on',el.dataset.rec===r));
    document.getElementById('fimRow').style.display=r==='perpetua'?'none':'';
    document.getElementById('customRow').style.display=r==='custom'?'':'none';
  }
}
 
function chave(m,y){return(y!==undefined?y:Y)+'-'+(m!==undefined?m:M);}
function gd(cid,m,y){let k=chave(m,y);if(!dados[k])dados[k]={};if(!dados[k][cid])dados[k][cid]=[];return dados[k][cid];}
function totalTipo(tipo,m,y){
  return cats.filter(c=>!FIXAS.includes(c.id)&&catAtiva(c,m??M,y??Y))
    .reduce((s,c)=>s+gd(c.id,m??M,y??Y).filter(l=>l.tipo===tipo).reduce((a,l)=>a+(parseFloat(l.valor)||0),0),0);
}
function saldoBruto(m,y){return totalTipo('receita',m,y)-totalTipo('despesa',m,y)-totalTipo('investimento',m,y);}
function calcSaldo(m,y){
  let acum=0;
  for(let i=0;i<m;i++){acum+=saldoBruto(i,y);if(acum<0)acum=0;}
  let carry=acum,bruto=saldoBruto(m,y),total=carry+bruto;
  return{carry,bruto,total:total<0?bruto:total};
}
function totalCatTipo(cid,tipo,m,y){return gd(cid,m??M,y??Y).filter(l=>l.tipo===tipo).reduce((s,l)=>s+(parseFloat(l.valor)||0),0);}
 
function atualizaResumo(){
  let rec=totalTipo('receita'),dep=totalTipo('despesa')+totalTipo('investimento');
  let{carry,total}=calcSaldo(M,Y);
  document.getElementById('sRec').textContent=fmtS(rec);
  document.getElementById('sDep').textContent=fmtS(dep);
  document.getElementById('sSaldo').textContent=fmtS(total);
  document.getElementById('sHint').textContent=carry>0?'+ ant. '+fmtS(carry):'';
}
 
function renderAbas(){
  let nav=document.getElementById('abas');nav.innerHTML='';
  let visiveis=cats.filter(c=>c.id==='balanco'||(!FIXAS.includes(c.id)&&catAtiva(c,M,Y)));
  visiveis.forEach(c=>{
    let b=document.createElement('button');
    b.className='ab'+(c.id===aba?' on':'');
    let dot=(!FIXAS.includes(c.id)&&c.rec!=='perpetua')?'<span class="aba-rec-dot"></span>':'';
    b.innerHTML=esc(c.nome)+dot;
    b.onclick=()=>{aba=c.id;renderAbas();renderMain();};
    nav.appendChild(b);
  });
  if(!visiveis.find(c=>c.id===aba))aba='balanco';
}
 
function renderMain(){
  if(aba==='balanco'){renderBalancoRoot();return;}
  renderDetalhe();
}
 
function renderBalancoRoot(){
  atualizaResumo();
  document.getElementById('main').innerHTML=`<div class="sub-abas">
    <button class="sub-ab ${subAba==='balanco'?'on':''}" onclick="setSubAba('balanco')">Balanço</button>
    <button class="sub-ab ${subAba==='graficos'?'on':''}" onclick="setSubAba('graficos')">Gráficos</button>
    <button class="sub-ab ${subAba==='anual'?'on':''}" onclick="setSubAba('anual')">Ano</button>
  </div><div id="subConteudo"></div>`;
  renderSubConteudo();
}
function setSubAba(s){
  subAba=s;
  document.querySelectorAll('.sub-ab').forEach(el=>{
    const map={balanco:'Balanço',graficos:'Gráficos',anual:'Ano'};
    el.classList.toggle('on',el.textContent.trim()===map[s]);
  });
  renderSubConteudo();
}
function renderSubConteudo(){
  if(subAba==='balanco')renderBalancoConteudo();
  else if(subAba==='graficos')renderGraficos();
  else if(subAba==='anual')renderAnual();
}
 
function renderBalancoConteudo(){
  let catAtivas=cats.filter(c=>!FIXAS.includes(c.id)&&catAtiva(c,M,Y));
  let totalRec=totalTipo('receita'),totalDep=totalTipo('despesa'),totalInv=totalTipo('investimento');
  let{carry,total:saldo}=calcSaldo(M,Y);
  let ftxt=carry>0?'Inclui saldo acumulado positivo dos meses anteriores':'Receitas − Despesas − Invest.';
  let receitasCat=[],despesasCat=[];
  catAtivas.forEach(c=>{
    let rec=totalCatTipo(c.id,'receita'),dep=totalCatTipo(c.id,'despesa'),inv=totalCatTipo(c.id,'investimento'),sal=rec-dep-inv;
    if(sal>0)receitasCat.push({c,valor:sal,rec,dep,inv});
    else if(sal<0)despesasCat.push({c,valor:Math.abs(sal),rec,dep,inv});
  });
  let rows='';
  rows+=`<tr class="s-rec"><td colspan="2">Receitas</td></tr>`;
  if(carry>0)rows+=`<tr><td>Saldo acumulado anterior<span class="cat-tipo-badge badge-rec">carry</span></td><td class="val-rec">${fmt(carry)}</td></tr>`;
  receitasCat.forEach(item=>{
    rows+=`<tr onclick="goToTab('${item.c.id}')" style="cursor:pointer;"><td>${esc(item.c.nome)}<span class="cat-tipo-badge badge-rec">entrada</span></td><td class="val-rec">${fmt(item.valor)}</td></tr>`;
    if(item.dep>0)rows+=`<tr onclick="goToTab('${item.c.id}')" style="cursor:pointer;opacity:0.8;"><td style="padding-left:28px;font-size:12px;color:var(--T3);">↳ despesas internas</td><td class="val-dep" style="font-size:12px;">-${fmt(item.dep)}</td></tr>`;
    if(item.inv>0)rows+=`<tr onclick="goToTab('${item.c.id}')" style="cursor:pointer;opacity:0.8;"><td style="padding-left:28px;font-size:12px;color:var(--T3);">↳ invest. internos</td><td class="val-inv" style="font-size:12px;">-${fmt(item.inv)}</td></tr>`;
  });
  rows+=`<tr class="tot"><td>Total receitas</td><td class="val-rec">${fmt(totalRec+(carry>0?carry:0))}</td></tr>`;
  rows+=`<tr class="s-dep"><td colspan="2">Despesas</td></tr>`;
  despesasCat.forEach(item=>{
    rows+=`<tr onclick="goToTab('${item.c.id}')" style="cursor:pointer;"><td>${esc(item.c.nome)}<span class="cat-tipo-badge badge-dep">a pagar</span></td><td class="val-dep">${fmt(item.valor)}</td></tr>`;
  });
  rows+=`<tr class="tot"><td>Total despesas</td><td class="val-dep">${fmt(totalDep)}</td></tr>`;
  rows+=`<tr class="tot"><td style="font-weight:700;">Saldo do mês</td><td class="${saldo>=0?'val-rec':'val-dep'}" style="font-weight:700;">${fmt(saldo)}</td></tr>`;
  let el=document.getElementById('subConteudo');
  if(el)el.innerHTML=`<div class="tc"><div class="tw"><table><thead><tr><th>Categoria</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table><div class="sf">${ftxt}<br><span style="color:var(--G);font-size:10px;">Toque em uma categoria para ver os lançamentos</span></div></div></div>`;
}
 
function goToTab(id){aba=id;renderAbas();renderMain();}
 
let abaTipo={};
function setLncModo(m){
  lncModo=m;
  document.querySelectorAll('.lm').forEach(el=>{
    el.classList.remove('on-p','on-g','on-x');

function renderGraficosCat(cid){
  let linhas=gd(cid);
  let deps=linhas.filter(l=>l.tipo==='despesa');
  let recs=linhas.filter(l=>l.tipo==='receita');
  let invs=linhas.filter(l=>l.tipo==='investimento');
  if(deps.length===0&&recs.length===0&&invs.length===0)return'';
 
  function agrupar(list){
    let mapa={};
    list.forEach(l=>{let k=(l.desc||'—').trim();mapa[k]=(mapa[k]||0)+(parseFloat(l.valor)||0);});
    return Object.entries(mapa).map(([desc,valor])=>({desc,valor})).sort((a,b)=>b.valor-a.valor);
  }
  function blocoGrafico(list,cor,titulo,corCss){
    if(list.length===0)return'';
    let ag=agrupar(list);
    let max=Math.max(...ag.map(i=>i.valor),1);
    let bars=ag.map(i=>{
      let p=Math.round(i.valor/max*100);
      let opac=(0.3+0.7*(i.valor/max)).toFixed(2);
      return`<div class="cat-bar-row"><div class="cat-bar-lbl">${esc(i.desc)}</div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${p}%;background:${cor};opacity:${opac};"></div></div><div class="cat-bar-val" style="color:${corCss};">${fmt(i.valor)}</div></div>`;
    }).join('');
    let tot=ag.reduce((s,i)=>s+i.valor,0);
    return`<div class="cat-chart-block"><div class="cat-chart-title">${titulo} — Total: <span style="color:${corCss};font-family:var(--m);">${fmt(tot)}</span></div>${bars}</div>`;
  }
  let html='<div class="cat-charts">';
  html+=blocoGrafico(recs,'#2ECC71','Receitas','var(--G)');
  html+=blocoGrafico(deps,'#FF3B30','Despesas','var(--RM)');
  html+=blocoGrafico(invs,'#007AFF','Investimentos','var(--BM)');
  html+='</div>';
  return html;
}
 
function propagarEdicao(cid, mAtual, yAtual, linhaOriginal, campo, novoValor){
  let chaves=[];
  for(let mi=mAtual+1;mi<12;mi++) chaves.push(chave(mi,yAtual));
  for(let yi=yAtual+1;yi<=yAtual+2;yi++) for(let mi=0;mi<12;mi++) chaves.push(chave(mi,yi));
 
  if(linhaOriginal.modo==='parcelas'&&linhaOriginal.parcId){
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][cid])return;
      dados[k][cid].forEach(l=>{
        if(l.parcId===linhaOriginal.parcId){l[campo]=novoValor;}
      });
    });
  } else if(linhaOriginal.modo==='perpetuo'||linhaOriginal.modo==='recebimento'){
    let descOrig=linhaOriginal.desc,tipoOrig=linhaOriginal.tipo,modoOrig=linhaOriginal.modo;
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][cid])return;
      dados[k][cid].forEach(l=>{
        if(l.modo===modoOrig&&l.tipo===tipoOrig&&l.desc===descOrig){l[campo]=novoValor;}
      });
    });
  }
}
 
function propagarDelete(cid, mAtual, yAtual, linhaOriginal){
  let chaves=[];
  for(let mi=mAtual+1;mi<12;mi++) chaves.push(chave(mi,yAtual));
  for(let yi=yAtual+1;yi<=yAtual+2;yi++) for(let mi=0;mi<12;mi++) chaves.push(chave(mi,yi));
 
  if(linhaOriginal.modo==='parcelas'&&linhaOriginal.parcId){
    let pid=linhaOriginal.parcId;
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][cid])return;
      dados[k][cid]=dados[k][cid].filter(l=>l.parcId!==pid);
    });
  } else if(linhaOriginal.modo==='perpetuo'||linhaOriginal.modo==='recebimento'){
    let descOrig=linhaOriginal.desc,tipoOrig=linhaOriginal.tipo,modoOrig=linhaOriginal.modo;
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][cid])return;
      dados[k][cid]=dados[k][cid].filter(l=>!(l.modo===modoOrig&&l.tipo===tipoOrig&&l.desc===descOrig));
    });
  }
}

    <button class="lm${lncModo==='unico'?' on-p':''}" data-m="unico" onclick="setLncModo('unico')">Único</button>

    <button class="lm${lncModo==='recebimento'?' on-g':''}" data-m="recebimento" onclick="setLncModo('recebimento')">Receb. ∞</button>
    <button class="lm${lncModo==='parcelas'?' on-x':''}" data-m="parcelas" onclick="setLncModo('parcelas')">Parcelas</button>
    <div class="parc-wrap${lncModo==='parcelas'?' show':''}" id="parcWrap">
      <input type="number" id="nParcelas" value="${lncParcelas}" min="2" max="360" oninput="lncParcelas=parseInt(this.value)||2" inputmode="numeric"/>
      <span>×</span>
    </div>

  document.getElementById('main').innerHTML=`<div class="tc"><div class="tw">${grafCat}<div class="al"><div class="al-tipo"><button class="at ${t==='receita'?'ar':''}" id="atR" onclick="setAbaTipo('receita')">Receita</button><button class="at ${t==='despesa'?'ad':''}" id="atD" onclick="setAbaTipo('despesa')">Despesa</button><button class="at ${t==='investimento'?'ai':''}" id="atI" onclick="setAbaTipo('investimento')">Invest.</button></div>${modoHtml}<div class="al-row"><input type="text" id="nDesc" placeholder="Descrição..."/><input type="number" id="nVal" placeholder="0,00" min="0" step="0.01" inputmode="decimal"/><button class="abtn" onclick="addLinha()">+</button></div></div><table><thead><tr><th>Descrição</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table>${recInfo}</div></div>`;

function addLinha(){
  let desc=document.getElementById('nDesc').value.trim(),valor=parseFloat(document.getElementById('nVal').value)||0;
  if(!desc)return;
  let tipo=abaTipo[aba]||'despesa';
  let modo=lncModo;
  let parcTotal=modo==='parcelas'?Math.max(2,parseInt(document.getElementById('nParcelas')?.value)||lncParcelas):null;
  if(modo==='unico'){
    gd(aba).unshift({desc,valor,tipo,modo:'unico'});
  } else if(modo==='perpetuo'||modo==='recebimento'){
    for(let mi=M;mi<12;mi++) gd(aba,mi,Y).unshift({desc,valor,tipo,modo});
    for(let yi=Y+1;yi<=Y+2;yi++) for(let mi=0;mi<12;mi++) gd(aba,mi,yi).unshift({desc,valor,tipo,modo});
  } else if(modo==='parcelas'&&parcTotal>=2){
    let pid='p'+Date.now();
    for(let p=0;p<parcTotal;p++){
      let mi=(M+p)%12,yi=Y+Math.floor((M+p)/12);
      gd(aba,mi,yi).unshift({desc,valor,tipo,modo:'parcelas',parcAtual:p+1,parcTotal,parcId:pid});
    }
  }
  salvar();renderDetalhe();
}
 
function delLinha(i){
  let linhas=gd(aba);
  let l=linhas[i];
  if(l&&(l.modo==='perpetuo'||l.modo==='recebimento'||l.modo==='parcelas')){
    propagarDelete(aba,M,Y,l);
  }
  linhas.splice(i,1);
  salvar();renderDetalhe();
}
 
function editDesc(i,v){
  let linhas=gd(aba);
  let l=linhas[i];
  let descAnterior=l.desc;
  l.desc=v;
  if(l&&(l.modo==='perpetuo'||l.modo==='recebimento')){
    let chaves=[];
    for(let mi=M+1;mi<12;mi++) chaves.push(chave(mi,Y));
    for(let yi=Y+1;yi<=Y+2;yi++) for(let mi=0;mi<12;mi++) chaves.push(chave(mi,yi));
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][aba])return;
      dados[k][aba].forEach(ll=>{
        if(ll.modo===l.modo&&ll.tipo===l.tipo&&ll.desc===descAnterior){ll.desc=v;}
      });
    });
  } else if(l&&l.modo==='parcelas'&&l.parcId){
    let chaves=[];
    for(let mi=M+1;mi<12;mi++) chaves.push(chave(mi,Y));
    for(let yi=Y+1;yi<=Y+2;yi++) for(let mi=0;mi<12;mi++) chaves.push(chave(mi,yi));
    chaves.forEach(k=>{
      if(!dados[k]||!dados[k][aba])return;
      dados[k][aba].forEach(ll=>{if(ll.parcId===l.parcId)ll.desc=v;});
    });
  }
  salvar();atualizaResumo();
}
 
function editVal(i,v){
  let linhas=gd(aba);

  let rec=editRec,inicio=document.getElementById('eInicio').value||null;
  let fim=(rec!=='perpetua')?document.getElementById('eFim').value||null:null;
  let customMeses=(rec==='custom')?parseInt(document.getElementById('eCustomMeses').value)||2:null;
  if(rec==='custom'&&(!customMeses||customMeses<1)){alert('Informe o intervalo em meses.');return;}
  c.nome=nome;c.rec=rec;c.inicio=inicio;c.fim=fim;c.customMeses=customMeses;
  salvar();fecharModalEdit();renderCList();renderAbas();renderMain();
}
 
function renderCList(){
  let el=document.getElementById('clist');
  let editaveis=cats.filter(c=>!FIXAS.includes(c.id));
  el.innerHTML=editaveis.map(c=>{
    let badges='';
    if(c.rec==='perpetua')badges+=`<span class="ci-badge b-per">perpétua</span>`;
    else if(c.rec==='mensal')badges+=`<span class="ci-badge b-rec">mensal</span>`;
    else if(c.rec==='bimestral')badges+=`<span class="ci-badge b-rec">bimestral</span>`;
    else if(c.rec==='custom')badges+=`<span class="ci-badge b-rec">a cada ${c.customMeses}m</span>`;
    if(c.inicio)badges+=`<span class="ci-badge b-dat">de ${c.inicio}</span>`;
    if(c.fim)badges+=`<span class="ci-badge b-temp">até ${c.fim}</span>`;
    return`<div class="ci" data-id="${c.id}">
      <span class="ci-drag" data-id="${c.id}" title="Arraste">
        <svg width="14" height="20" viewBox="0 0 14 20" fill="none"><circle cx="4" cy="5" r="1.5" fill="currentColor" opacity="0.5"/><circle cx="10" cy="5" r="1.5" fill="currentColor" opacity="0.5"/><circle cx="4" cy="10" r="1.5" fill="currentColor" opacity="0.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor" opacity="0.5"/><circle cx="4" cy="15" r="1.5" fill="currentColor" opacity="0.5"/><circle cx="10" cy="15" r="1.5" fill="currentColor" opacity="0.5"/></svg>
      </span>
      <div style="flex:1;min-width:0;"><div class="ci-name">${esc(c.nome)}</div><div class="ci-badges">${badges}</div></div>
      <div class="ci-meta">
        <button class="edit-btn" onclick="abrirModalEdit('${c.id}')" title="Editar">${editIconSVG()}</button>
        <button class="dbtn" onclick="delCat('${c.id}')">&#215;</button>
      </div>
    </div>`;
  }).join('');
  initDragDrop();
}
 
/* ===== DRAG & DROP ===== */
let dragId=null,ghostEl=null,dragSourceEl=null;
function createGhost(nome){let g=document.createElement('div');g.className='drag-ghost';g.innerHTML=`<span class="drag-ghost-dot"></span>${esc(nome)}`;document.body.appendChild(g);return g;}
function moveGhost(x,y){if(!ghostEl)return;ghostEl.style.transform=`translate(${x-80}px,${y-22}px) rotate(1.5deg) scale(1.04)`;}
function removeGhost(){if(ghostEl){ghostEl.remove();ghostEl=null;}}
function clearTC(){document.querySelectorAll('.ci').forEach(r=>r.classList.remove('drag-target-above','drag-target-below'));}
function findTarget(cy){
  let rows=[...document.querySelectorAll('#clist .ci:not(.dragging-source)')];
  let target=null,pos='below';
  for(let r of rows){let rect=r.getBoundingClientRect(),mid=rect.top+rect.height/2;if(cy<mid){target=r;pos='above';break;}else{target=r;pos='below';}}
  return{target,pos};
}
function initDragDrop(){
  document.querySelectorAll('#clist .ci-drag').forEach(h=>{
    h.addEventListener('mousedown',startMD,{passive:false});
    h.addEventListener('touchstart',startTD,{passive:false});
  });
}
function getRow(el){return el.closest('.ci');}
function startMD(e){e.preventDefault();let row=getRow(e.currentTarget),id=row.dataset.id,cat=cats.find(c=>c.id===id);dragId=id;dragSourceEl=row;row.classList.add('dragging-source');ghostEl=createGhost(cat?cat.nome:id);moveGhost(e.clientX,e.clientY);document.addEventListener('mousemove',onMM);document.addEventListener('mouseup',stopMD);}
function onMM(e){moveGhost(e.clientX,e.clientY);clearTC();let{target,pos}=findTarget(e.clientY);if(target&&target!==dragSourceEl)target.classList.add(pos==='above'?'drag-target-above':'drag-target-below');}
function stopMD(e){document.removeEventListener('mousemove',onMM);document.removeEventListener('mouseup',stopMD);clearTC();removeGhost();if(dragSourceEl)dragSourceEl.classList.remove('dragging-source');if(!dragId){dragId=null;return;}let{target,pos}=findTarget(e.clientY);reorderCat(dragId,target&&target!==dragSourceEl?target.dataset.id:null,pos);dragId=null;dragSourceEl=null;}
function startTD(e){e.preventDefault();let row=getRow(e.currentTarget),id=row.dataset.id,cat=cats.find(c=>c.id===id);dragId=id;dragSourceEl=row;row.classList.add('dragging-source');let t=e.touches[0];ghostEl=createGhost(cat?cat.nome:id);moveGhost(t.clientX,t.clientY);document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',stopTD);}
function onTM(e){e.preventDefault();let t=e.touches[0];moveGhost(t.clientX,t.clientY);clearTC();let{target,pos}=findTarget(t.clientY);if(target&&target!==dragSourceEl)target.classList.add(pos==='above'?'drag-target-above':'drag-target-below');}
function stopTD(e){document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',stopTD);clearTC();removeGhost();if(dragSourceEl)dragSourceEl.classList.remove('dragging-source');if(!dragId){dragId=null;return;}let t=e.changedTouches[0];let ft=findTarget(t.clientY);reorderCat(dragId,ft.target&&ft.target!==dragSourceEl?ft.target.dataset.id:null,ft.pos);dragId=null;dragSourceEl=null;}
function reorderCat(srcId,targetId,pos){
  let fixasBefore=cats.slice(0,cats.findIndex(c=>!FIXAS.includes(c.id)));
  let lastEditIdx=cats.reduce((acc,c,i)=>!FIXAS.includes(c.id)?i:acc,-1);
  let fixasAfter=cats.slice(lastEditIdx+1);
  let mid=cats.filter(c=>!FIXAS.includes(c.id));
  let si=mid.findIndex(c=>c.id===srcId);if(si<0)return;
  let[item]=mid.splice(si,1);
  if(!targetId)mid.push(item);
  else{let ti=mid.findIndex(c=>c.id===targetId);if(ti<0)mid.push(item);else mid.splice(pos==='below'?ti+1:ti,0,item);}
  cats=[...fixasBefore,...mid,...fixasAfter];
  salvar();renderCList();renderAbas();
}
 
function adicionarCat(){
  let nome=document.getElementById('nNome').value.trim();if(!nome)return;
  let rec=novaRec,inicio=document.getElementById('nInicio').value||null;
  let fim=(rec!=='perpetua')?document.getElementById('nFim').value||null:null;
  let customMeses=(rec==='custom')?parseInt(document.getElementById('nCustomMeses').value)||2:null;
  if(rec==='custom'&&(!customMeses||customMeses<1)){alert('Informe o intervalo em meses.');return;}
  let id='c'+Date.now(),idx=cats.findIndex(c=>c.id==='graficos');
  cats.splice(idx,0,{id,nome,rec,customMeses,inicio,fim});
  document.getElementById('nNome').value='';
  salvar();renderCList();renderAbas();
}
 
function delCat(id){
  cats=cats.filter(c=>c.id!==id);
  if(aba===id)aba='balanco';
  salvar();renderCList();renderAbas();renderMain();
}
 
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('ov-edit').addEventListener('click',function(e){if(e.target===this)fecharModalEdit();});
 
setRec('perpetua','new');
document.getElementById('mesTit').textContent=MESES[M]+' '+Y;
renderAbas();
renderMain();
</script>
